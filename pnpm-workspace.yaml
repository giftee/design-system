packages:
  - "packages/**"

# cooldown 期間の設定。公開から 3 日(4320 分)経過したもののみをインストールの対象とする
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4

overrides:
  # Dependabot alert #15 (esbuild < 0.28.1)
  esbuild: ^0.28.2
  # Dependabot alert #55 (glob >= 9.0.0, <= 14.0.1)
  glob@13: ^14.0.4
  # Dependabot alert #56 (minimatch < 11.0.1)
  minimatch@10: ^11.0.5

# pnpm 12 ではビルドスクリプトの扱いを明示する必要がある。
# .npmrc で ignore-scripts=true としているため、いずれも実行しない
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
