name: react_test

on:
  pull_request:
    paths:
      - packages/react/**
      - packages/css/**
      - packages/designTokens/**
      - ".github/workflows/react_test.yml"
    branches:
      - main
  push:
    paths:
      - packages/react/**
      - ".github/workflows/react_test.yml"
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: npm install -g corepack@latest
      - run: corepack enable
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
        working-directory: ./packages/react
      - name: Markuplint
        run: pnpm lint:markuplint
        working-directory: ./packages/react
      - name: Format
        run: pnpm prettier
        working-directory: ./packages/react
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: npm install -g corepack@latest
      - run: corepack enable
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build dependencies (design tokens, CSS)
        run: pnpm --filter @giftee/abukuma-design-tokens --filter @giftee/abukuma-css build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: ./packages/react
      - name: Unit test
        run: pnpm test:unit
        working-directory: ./packages/react
      - name: Storybook test (interaction + a11y)
        run: pnpm test:storybook
        working-directory: ./packages/react
